<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex6</title>
        
    <style>
        .parent {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            height: 90vh;
            margin: 20px;
            gap: 20px;
        }
        .child1 {
             background-color: aqua;
             grid-column: 1/3;
             grid-row: 1fr 1fr 2fr 1fr;
        }
        .child2 {
            background-color: bisque;
        }
        .child3 {
            background-color: lightcoral;
        }
        .child4 {
            background-color: lightgreen;
        }
        .child5 {
            background-color: lightsalmon;
        }
        .child6 {
            background-color: lightsteelblue;
            grid-column: 3/4;
        }
           .child7 {
            background-color: crimson;
            grid-column: 1/3;
            grid-row: 3/5;
        }
        .child8 {
            background-color: bisque;
            grid-column: 3/4;
        }
        .child9 {
            background-color: lightgreen;
        }
        .child10 {
            background-color: lightgreen;
        }
        .child11 {
            background-color: lightsalmon;
            grid-column: 1/4;
        }
        .child12 {
            background-color: lightsteelblue;
        }
    </style>
</head>
<body>
    <a href="./index.html">Back to home page</a>
    <div class="parent">
    <div class="child1">child1</div>
    <div class="child2">child2</div>
    <div class="child3">child3</div>
    <div class="child4">child4</div>
    <div class="child5">child5</div>
    <div class="child6">child6</div>
    <div class="child7">child7</div>
    <div class="child8">child8</div>
    <div class="child9">child9</div>
    <div class="child10">child10</div>
    <div class="child11">child11</div>
    <div class="child12">child12</div>
    </div>
</body>
</html>
